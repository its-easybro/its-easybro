name: Summon the serpent

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the serpent
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpent.svg?palette=github-light&color_snake=#B8913F&color_dots=#ebedf0,#e9dcc0,#d9bd7f,#c49a45,#8a6a26
            dist/serpent-dark.svg?palette=github-dark&color_snake=#E8C27A&color_dots=#15112B,#2d2458,#4a3d8f,#7b6be0,#E8C27A

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
